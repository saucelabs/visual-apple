name: Apple (build)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true


# Each device family runs in its own job, so no runner boots more than one simulator.
# Once the package tests pass, the XCFramework builds alongside the source tests, and only the binary tests wait for it.
jobs:
  package-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Validate native project and script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/test.sh
          bash -n Scripts/build-xcframework.sh
          bash -n Scripts/pin-simulators.sh
          bash -n Scripts/check-xcodeproj-sources.sh
          plutil -lint SauceVisual.xcodeproj/project.pbxproj \
            Tests/Integration/Source.xcodeproj/project.pbxproj \
            Tests/Integration/Binary.xcodeproj/project.pbxproj
          # The XCFramework is built from the Xcode project, which lists source files by hand.
          Scripts/check-xcodeproj-sources.sh

      - name: Run package tests in Debug, Release, and Swift 6 language mode
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors \
            2>&1 | tee build/swift-debug.log
          xcrun swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors \
            2>&1 | tee build/swift-release.log
          xcrun swift test -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors \
            2>&1 | tee build/swift6.log

      - name: Retain package-test logs
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: visual-apple-package-results
          if-no-files-found: warn
          retention-days: 7
          path: build/*.log

  source-tests:
    name: source-tests (${{ matrix.family }})
    needs: package-tests
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad, tvos, macos]
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      # Same devices and OS versions on every run, so snapshots keep matching their baselines.
      - name: Pin simulators
        if: matrix.family != 'macos'
        run: Scripts/pin-simulators.sh

      - name: Test source-SPM consumer
        shell: bash
        # Only the consumer tests get credentials: their live tests create real Sauce Visual builds.
        env:
          FAMILY: ${{ matrix.family }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          # The Safari test runs locally only: on CI it is slow and flaky on a fresh simulator.
          SKIP_SAFARI_TESTS: "1"
        run: |
          set -euo pipefail
          [[ -n ${SAUCE_USERNAME:-} && -n ${SAUCE_ACCESS_KEY:-} ]] || {
            echo "::error::The live consumer tests need the SAUCE_USERNAME and SAUCE_ACCESS_KEY secrets, which pull requests from forks don't get."
            exit 1
          }
          case $FAMILY in
            iphone) udid=${SIMULATOR_UDID_IPHONE:-} ;;
            ipad) udid=${SIMULATOR_UDID_IPAD:-} ;;
            tvos) udid=${SIMULATOR_UDID_TVOS:-} ;;
            *) udid= ;;
          esac
          SIMULATOR_UDID=$udid Scripts/test.sh source "$FAMILY"

      # Never upload DerivedData or result bundles (.xcresult): xcodebuild records the test-runner environment,
      # including the access key, in both. GitHub masks secrets in logs, not in artifacts.
      - name: Retain source-test results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: visual-apple-source-results-${{ matrix.family }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/**/*.log
            build/**/results.json
            !build/**/DerivedData/**
            !build/**/*.xcresult/**

  xcframework:
    needs: package-tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - name: Build and inspect the XCFramework
        run: Scripts/build-xcframework.sh

      # Artifact paths are relative to the repository root, not the working directory.
      - name: Upload candidate for independent binary validation
        uses: actions/upload-artifact@v6.0.0
        with:
          name: visual-apple-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            dist/*.xcframework.zip
            dist/LICENSE

      - name: Retain XCFramework build logs
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: visual-apple-xcframework-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/**/*.log
            !build/**/DerivedData*/**

  validate-binary:
    name: validate-binary (${{ matrix.family }})
    needs: xcframework
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad, tvos, macos]
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7.0.0
        with:
          name: visual-apple-candidate
          path: downloaded

      - name: Unpack the candidate for binary-only consumers
        shell: bash
        run: |
          set -euo pipefail
          archives=(downloaded/*.xcframework.zip)
          test "${#archives[@]}" -eq 1
          test -f "${archives[0]}"
          test -s downloaded/LICENSE
          mkdir dist
          ditto -x -k "${archives[0]}" dist
          test -d dist/SauceVisual.xcframework
          # Modify only the extracted test copy; retain the original ZIP for upload.
          # Fresh DerivedData in each test run prevents cached SDK module reuse.
          # This checks textual-interface import, not cross-compiler compatibility.
          find dist/SauceVisual.xcframework -type f -name '*.swiftmodule' -delete

      # Same devices and OS versions on every run, so snapshots keep matching their baselines.
      - name: Pin simulators
        if: matrix.family != 'macos'
        run: Scripts/pin-simulators.sh

      - name: Test independent binary consumer
        shell: bash
        # Only the consumer tests get credentials: their live tests create real Sauce Visual builds.
        env:
          FAMILY: ${{ matrix.family }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          # The Safari test runs locally only: on CI it is slow and flaky on a fresh simulator.
          SKIP_SAFARI_TESTS: "1"
        run: |
          set -euo pipefail
          [[ -n ${SAUCE_USERNAME:-} && -n ${SAUCE_ACCESS_KEY:-} ]] || {
            echo "::error::The live consumer tests need the SAUCE_USERNAME and SAUCE_ACCESS_KEY secrets, which pull requests from forks don't get."
            exit 1
          }
          case $FAMILY in
            iphone) udid=${SIMULATOR_UDID_IPHONE:-} ;;
            ipad) udid=${SIMULATOR_UDID_IPAD:-} ;;
            tvos) udid=${SIMULATOR_UDID_TVOS:-} ;;
            *) udid= ;;
          esac
          SIMULATOR_UDID=$udid Scripts/test.sh binary "$FAMILY"

      # Never upload DerivedData or result bundles: they contain the access key (see source-tests).
      - name: Retain binary-validation results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: visual-apple-binary-results-${{ matrix.family }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/**/*.log
            build/**/results.json
            !build/**/DerivedData/**
            !build/**/*.xcresult/**

  # Publishes the candidate only once every check has passed: package, all source families, all binary families.
  accept:
    needs: [package-tests, source-tests, validate-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: visual-apple-candidate
          path: candidate

      - name: Upload accepted integration artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: visual-apple-integration
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            candidate/*.xcframework.zip
            candidate/LICENSE

  attach-release-assets:
    if: github.event_name == 'release'
    needs: accept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: visual-apple-integration
          path: accepted

      - name: Attach the tested XCFramework and license
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          archives=(accepted/SauceVisual-*.xcframework.zip)
          [[ ${#archives[@]} -eq 1 && -s ${archives[0]} && -s accepted/LICENSE ]] || {
            echo '::error::Expected one validated SauceVisual XCFramework ZIP and its license.'
            exit 1
          }

          # A release event checks out the tagged commit. Ensure it still matches the tested run.
          tag_ref=$(jq -rn --arg ref "refs/tags/$RELEASE_TAG" '$ref | @uri')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_ref" --jq .sha)
          [[ $tag_sha == "$GITHUB_SHA" ]] || {
            echo '::error::The release tag no longer points to the tested commit.'
            exit 1
          }

          # Retain assets already uploaded by the same run, and reject any conflicting bytes.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
          pending=()
          for file in "${archives[0]}" accepted/LICENSE; do
            name=${file##*/}
            asset=$(jq -r --arg name "$name" '.[] | select(.name == $name) | [.state, .digest] | @tsv' <<< "$existing")
            if [[ -z $asset ]]; then
              pending+=("$file")
              continue
            fi
            digest=$(sha256sum "$file")
            [[ $asset == $'uploaded\tsha256:'"${digest%% *}" ]] || {
              echo "::error::Release asset $name already exists with different contents or an incomplete upload."
              exit 1
            }
          done
          if (( ${#pending[@]} )); then
            gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" "${pending[@]}"
          fi
